<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1280, height=800" />
    <style>
      html,
      body {
        width: 1280px;
        height: 800px;
        margin: 0;
        overflow: hidden;
        background: #faf8f5;
      }

      iframe {
        border: 0;
        display: block;
        width: 1280px;
        height: 800px;
      }
    </style>
  </head>
  <body>
    <iframe id="asset" title="asset renderer"></iframe>
    <script>
      const file = new URLSearchParams(window.location.search).get('file')
      document.getElementById('asset').src = file + '.svg'
    </script>
  </body>
</html>
