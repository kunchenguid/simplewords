<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Buttons</title>
    <link rel="stylesheet" href="_card.css" />
    <style>
      .stage {
        padding: 28px 32px;
        background: var(--paper);
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .btn {
        align-items: center;
        display: inline-flex;
        font-family: var(--font-sans);
        font-size: 13px;
        font-weight: 600;
        line-height: 1;
        border: 0;
        cursor: pointer;
        transition: all 120ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .btn--pill {
        border-radius: 999px;
        gap: 7px;
        padding: 8px 14px;
        background: #0e1525;
        color: #faf8f5;
        box-shadow: 0 8px 24px rgba(14, 21, 37, 0.22);
      }
      .btn--pill svg {
        height: 14px;
        width: 14px;
      }
      .btn--primary {
        border-radius: 8px;
        padding: 11px 16px;
        background: #0e1525;
        color: #faf8f5;
      }
      .btn--ghost {
        border-radius: 8px;
        padding: 9px 13px;
        background: transparent;
        color: #0e1525;
        border: 1px solid #c9d2e3;
      }
      .btn--accent {
        gap: 7px;
        border-radius: 8px;
        padding: 8px 14px;
        background: #2747d6;
        color: #faf8f5;
      }
      .btn--accent svg {
        height: 14px;
        width: 14px;
      }
      .btn--small {
        border-radius: 6px;
        padding: 6px 10px;
        font-size: 12px;
        background: #f1eee8;
        color: #0e1525;
      }
      .focused {
        outline: 2px solid #2747d6;
        outline-offset: 2px;
      }
      .label {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--fg-3);
        width: 60px;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="row">
        <span class="label">Default</span>
        <button class="btn btn--pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>
          Simple Words
        </button>
        <button class="btn btn--primary">Save</button>
        <button class="btn btn--ghost">Dismiss</button>
        <button class="btn btn--accent">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
          Refining
        </button>
        <button class="btn btn--small">Replace draft</button>
      </div>
      <div class="row">
        <span class="label">Focus</span>
        <button class="btn btn--pill focused">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg>
          Simple Words
        </button>
        <button class="btn btn--primary focused">Save</button>
        <button class="btn btn--ghost focused">Dismiss</button>
      </div>
    </div>
  </body>
</html>
