<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shadows</title>
<link rel="stylesheet" href="_card.css">
<style>
  .stage { padding: 36px 32px 40px; background: var(--paper); display: flex; align-items: flex-start; gap: 28px; justify-content: center; }
  .demo { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box {
    width: 140px; height: 80px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .meta { display: flex; flex-direction: column; gap: 2px; align-items: center; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--ink-900); }
  .px { font-family: var(--font-sans); font-size: 11px; color: var(--fg-3); }
  .s1 { box-shadow: 0 1px 2px rgba(14, 21, 37, 0.06); }
  .s2 { box-shadow: 0 8px 24px rgba(14, 21, 37, 0.22); border-color: transparent; }
  .s3 { box-shadow: 0 18px 48px rgba(14, 21, 37, 0.28); border-color: transparent; }
</style>
</head>
<body>
<div class="stage">
  <div class="demo">
    <div class="box s1"></div>
    <div class="meta"><span class="name">--shadow-1</span><span class="px">cards, inputs</span></div>
  </div>
  <div class="demo">
    <div class="box s2"></div>
    <div class="meta"><span class="name">--shadow-2</span><span class="px">floating button</span></div>
  </div>
  <div class="demo">
    <div class="box s3"></div>
    <div class="meta"><span class="name">--shadow-3</span><span class="px">floating panel</span></div>
  </div>
</div>
</body>
</html>
