<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Iconography</title>
    <link rel="stylesheet" href="_card.css" />
    <style>
      .stage {
        padding: 26px 32px;
        background: var(--paper);
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .row {
        display: flex;
        gap: 26px;
        align-items: center;
        flex-wrap: wrap;
      }
      .icon-tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .icon-tile svg {
        color: #0e1525;
      }
      .icon-tile .nm {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--fg-3);
      }
      .meta {
        font-family: var(--font-sans);
        font-size: 12px;
        color: var(--fg-3);
        line-height: 1.5;
      }
      .meta b {
        color: var(--fg-1);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="row">
        <div class="icon-tile">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"
            />
            <path d="M20 3v4" />
            <path d="M22 5h-4" />
            <path d="M4 17v2" />
            <path d="M5 18H3" />
          </svg>
          <span class="nm">sparkles</span>
        </div>
        <div class="icon-tile">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M5 3v4" />
            <path d="M19 17v4" />
            <path d="M3 5h4" />
            <path d="M17 19h4" />
            <path d="m14 7 3 3L7 20l-3-3z" />
            <path d="m14 7 3-3 3 3-3 3z" />
          </svg>
          <span class="nm">wand</span>
        </div>
        <div class="icon-tile">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z" />
            <path d="m15 5 4 4" />
          </svg>
          <span class="nm">pencil</span>
        </div>
        <div class="icon-tile">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
          <span class="nm">settings</span>
        </div>
        <div class="icon-tile">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 6 9 17l-5-5" />
          </svg>
          <span class="nm">check</span>
        </div>
        <div class="icon-tile">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
          <span class="nm">x</span>
        </div>
        <div class="icon-tile">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12a9 9 0 1 1-6.219-8.56" />
          </svg>
          <span class="nm">loader</span>
        </div>
      </div>
      <span class="meta"
        ><b>Lucide</b> · 1.5px stroke · currentColor · 14px production sparkles,
        16px production loader, 20/24px larger contexts. No emoji, no filled
        icons.</span
      >
    </div>
  </body>
</html>
