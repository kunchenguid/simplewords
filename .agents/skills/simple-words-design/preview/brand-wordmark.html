<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Brand wordmark</title>
    <link rel="stylesheet" href="_card.css" />
    <style>
      .stage {
        background: var(--paper);
        padding: 36px 40px 32px;
        display: flex;
        align-items: center;
        gap: 32px;
      }
      .wm {
        font-family: var(--font-serif);
        font-style: italic;
        font-weight: 400;
        font-size: 72px;
        line-height: 1;
        letter-spacing: -0.02em;
        color: var(--ink-900);
      }
      .meta {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .meta .desc {
        font-family: var(--font-sans);
        font-size: 13px;
        color: var(--fg-3);
        max-width: 220px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <span class="wm">Simple Words</span>
      <div class="meta">
        <span class="label">Wordmark</span>
        <span class="desc"
          >Instrument Serif italic, ink-900. The literary voice of the
          brand.</span
        >
      </div>
    </div>
  </body>
</html>
